<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Usage · LLM Gateway</title>
<link rel="icon" href="/ui/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/static/css/app.css">
<script src="/ui/static/js/theme.js"></script>
<script type="module" src="/ui/static/js/usage.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/ui"><img src="/ui/static/favicon.svg" alt=""> LLM Gateway</a>
    <nav class="nav" aria-label="Main">
      <a href="/ui">Playground</a>
      <a href="/ui/usage" aria-current="page">Usage</a>
      <a href="/ui/evals">Evals</a>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="btn btn-quiet btn-small" id="theme-toggle">◐ Auto</button>
      <button type="button" class="btn btn-small" id="key-toggle" aria-expanded="false" aria-controls="key-panel">Set key</button>
    </div>
  </div>
</header>
<section class="key-panel" id="key-panel" aria-label="API key" hidden>
  <div class="key-panel-inner">
    <form class="key-form" id="key-form" autocomplete="off">
      <label class="visually-hidden" for="api-key">Gateway API key</label>
      <input type="password" id="api-key" name="api-key" placeholder="llmgw_…" autocomplete="off" spellcheck="false" aria-describedby="key-status key-error">
      <button type="submit" class="btn">Use key</button>
      <button type="button" class="btn btn-quiet" id="key-forget" hidden>Forget key</button>
    </form>
    <p class="hint" id="key-error" role="alert" hidden></p>
    <p class="key-status" id="key-status" aria-live="polite"></p>
  </div>
</section>
<main id="main">
  <div class="page-head">
    <div>
      <h1>Usage</h1>
      <p class="lede">Requests, tokens and cost for your API key's user.</p>
    </div>
    <fieldset class="segmented" id="period">
      <legend class="visually-hidden">Period</legend>
      <input type="radio" name="days" id="days-1" value="1"><label for="days-1">1 day</label>
      <input type="radio" name="days" id="days-7" value="7" checked><label for="days-7">7 days</label>
      <input type="radio" name="days" id="days-30" value="30"><label for="days-30">30 days</label>
    </fieldset>
  </div>
  <div class="alert" id="usage-error" role="alert" hidden></div>
  <section class="stats" id="stats" aria-label="Totals" aria-live="polite"></section>
  <section class="card" aria-labelledby="chart-title">
    <div class="chart-head">
      <h2 id="chart-title">Requests per day</h2>
      <div>
        <label class="visually-hidden" for="metric">Chart metric</label>
        <select id="metric">
          <option value="requests">Requests</option>
          <option value="tokens">Tokens</option>
          <option value="cost">Cost (USD)</option>
        </select>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <details class="stack">
      <summary>Show as a table</summary>
      <div class="table-wrap" id="day-table"></div>
    </details>
  </section>
  <section class="card stack" aria-labelledby="models-title">
    <h2 id="models-title">By model</h2>
    <div class="table-wrap" id="model-table"></div>
  </section>
</main>
<footer class="page-foot">Your API key stays in this browser tab and is sent only to this gateway. Admin actions are only available from the command line.</footer>
</body>
</html>
