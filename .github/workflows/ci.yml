
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install fastapi uvicorn httpx pytest pytest-asyncio ruff mypy

      - name: Check code quality
        run: ruff check .

      - name: Check types
        run: mypy app

      - name: Run tests
        run: python -m pytest
