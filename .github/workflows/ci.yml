name: CI

on:
  push:
  pull_request:
  # Manual deploy from the Actions tab (runs the tests first, like a push).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Check types
        run: mypy app

      # The Redis and Postgres services above make every integration test run,
      # so coverage here is the real number. The gate is in pyproject.toml.
      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=term --cov-report=markdown:coverage.md
          { echo "## Coverage"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

      # The eval harness, end to end: a real gateway process, a real API key,
      # every request through auth, rate limits and usage tracking. The Mock
      # provider answers, so this costs nothing and is deterministic.
      - name: Run the eval harness against the Mock provider
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway_test
          REDIS_URL: redis://localhost:6379/14
        run: |
          python -m app.evals validate
          python -m app.db.migrate
          uvicorn app.main:app --port 8000 > gateway.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          python -m app.cli create-user ci-evals --rate-limit 600
          EVAL_API_KEY=$(python -m app.cli issue-key ci-evals | awk '$1 == "Key" && $2 == ":" {print $3}')
          echo "::add-mask::$EVAL_API_KEY"
          export EVAL_API_KEY
          python -m app.evals run --dataset mock_smoke --model mock-1 --model chat-test \
            --no-cache --min-pass-rate 1 --markdown eval-report
          python -m app.evals compare 1 2 --fail-on-regression
          curl -sf localhost:8000/metrics | grep 'gateway_eval_pass_rate{dataset="mock_smoke"'
          cat eval-report/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show the gateway log
        if: failure()
        run: cat gateway.log || true

  # Terraform checks need no AWS credentials: formatting, a backend-less init,
  # validation and lint, for both the main config and the bootstrap.
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # for downloading the AWS ruleset
        run: |
          for dir in infra infra/bootstrap; do
            tflint --chdir="$dir" --init
            tflint --chdir="$dir" --format compact
          done

      - name: Check the deploy scripts
        run: shellcheck -x infra/scripts/*.sh

  # Deploy to AWS after every check passes on main. It needs GitHub OIDC, which
  # the AWS free plan's SCP blocks, so by default this job does nothing: it runs
  # only when the AWS_DEPLOY_ROLE_ARN repository variable is set (see
  # docs/deploy.md), and even then it skips cleanly if the role or the
  # infrastructure is gone (destroyed after a demo). The usual deploy is
  # infra/scripts/deploy.sh from a laptop.
  deploy:
    needs: [test, terraform]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm # native arm64 build for Graviton Fargate tasks
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for AWS

    steps:
      - name: Check whether deploys are configured
        id: configured
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set: deploys are manual (infra/scripts/deploy.sh). Skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Get AWS credentials (OIDC)
        id: aws
        if: steps.configured.outputs.enabled == 'true'
        continue-on-error: true # a destroyed role means "nothing to deploy"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Skip if the deploy role is gone
        if: steps.configured.outputs.enabled == 'true' && steps.aws.outcome != 'success'
        run: echo "::warning::Could not assume the deploy role; the infrastructure is probably destroyed. Skipping the deploy."

      - name: Deploy
        if: steps.configured.outputs.enabled == 'true' && steps.aws.outcome == 'success'
        run: infra/scripts/deploy.sh --skip-if-missing
